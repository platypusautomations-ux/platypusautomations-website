<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Lead Flow Audit — Platypus Automations</title>
  <meta name="description" content="Find out exactly how much revenue you're leaving on the table. Take our 2-minute AI audit.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Barlow', system-ui, sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #07111f 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .chatbot-card {
      background: rgba(10, 22, 40, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 122, 122, 0.3);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 32px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.2;
      margin-bottom: 12px;
      color: #fff;
    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .question-block {
      margin-bottom: 28px;
      display: none;
    }

    .question-block.active {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-text {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
      color: #fff;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 16px;
      background: rgba(0, 122, 122, 0.1);
      border: 1px solid rgba(0, 122, 122, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      background: rgba(0, 122, 122, 0.3);
      border-color: rgba(0, 160, 160, 0.8);
    }

    .option-btn.selected {
      background: rgba(0, 160, 160, 0.5);
      border-color: #00a0a0;
      box-shadow: 0 0 12px rgba(0, 160, 160, 0.3);
    }

    .email-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 122, 122, 0.1);
      border: 1px solid rgba(0, 122, 122, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .email-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .email-input:focus {
      outline: none;
      background: rgba(0, 122, 122, 0.2);
      border-color: rgba(0, 160, 160, 0.8);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #00a0a0;
      color: #fff;
    }

    .btn-primary:hover {
      background: #00c5c5;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-bottom: 32px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00a0a0 0%, #E8651A 100%);
      transition: width 0.3s ease;
    }

    .result-block {
      display: none;
    }

    .result-block.active {
      display: block;
      animation: fadeIn 0.4s ease-in;
    }

    .diagnosis {
      background: rgba(0, 160, 160, 0.15);
      border-left: 4px solid #00a0a0;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 15px;
      line-height: 1.6;
    }

    .cta-section {
      text-align: center;
    }

    .cta-section h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #fff;
    }

    .loading {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chatbot-card">
      <div class="header">
        <h1>Your Free Lead Flow Audit</h1>
        <p>2 minutes to see exactly how much revenue you're leaving on the table</p>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>

      <div id="chatbotContainer">
        <!-- Questions will be inserted here by JavaScript -->
      </div>

      <div id="resultContainer" class="result-block">
        <div class="diagnosis" id="diagnosisText"></div>
        <div class="cta-section">
          <h3>Next Step: Schedule Your Consultation</h3>
          <button class="btn btn-primary" onclick="openCalendly()">Book 15-Min Consultation</button>
          <p style="font-size: 13px; margin-top: 12px; color: rgba(255, 255, 255, 0.5);">
            Or <a href="#" onclick="showTrialOption(event)" style="text-decoration: underline; color: #00a0a0;">start a free 2-week trial</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/lead-audit-chatbot.js"></script>
</body>
</html>
